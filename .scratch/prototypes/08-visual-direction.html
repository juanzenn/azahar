<!--
  PROTOTYPE — throwaway. Ticket 08 "Visual design direction".
  Three radically different storefront directions for Azahar, switchable via
  ?variant=A|B|C and a floating bottom bar. Answers: layout, card style, palette,
  imagery treatment, typography feel, and how advanced-search results should look.
  NOT production code. Imagery = gradient + emoji placeholders (real photos are a
  seed concern, ticket 06). Type = system font stacks standing in for real webfonts.
-->
<title>Azahar — Direcciones de diseño (prototipo)</title>
<style>
  /* ---------- page scaffold + prototype chrome (NOT part of any design) ---------- */
  * { box-sizing: border-box; }
  :root {
    --chrome-bg: #0e0f13;
    --chrome-fg: #f4f4f5;
    --chrome-muted: #a1a1aa;
    --chrome-line: #2a2b31;
  }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #16171c;
    color: var(--chrome-fg);
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100vh; }

  /* screen annotation label — dashed pill, obviously not the design */
  .anno {
    max-width: 1200px;
    margin: 0 auto;
    padding: 26px 24px 8px;
  }
  .anno-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--chrome-muted);
    border: 1px dashed var(--chrome-line);
    border-radius: 999px; padding: 5px 12px; background: #1c1d23;
  }

  /* ---------- floating variant switcher ---------- */
  .switcher {
    position: fixed; z-index: 9999; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 2px;
    background: var(--chrome-bg); color: var(--chrome-fg);
    border: 1px solid var(--chrome-line);
    border-radius: 14px; padding: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .switcher button {
    all: unset; cursor: pointer; display: flex; align-items: center; justify-content: center;
    width: 40px; border-radius: 9px; color: var(--chrome-fg); font-size: 18px;
  }
  .switcher button:hover { background: #26272e; }
  .switcher button:focus-visible { outline: 2px solid #7c9cff; outline-offset: 2px; }
  .switcher .label {
    display: flex; flex-direction: column; justify-content: center; padding: 4px 16px; min-width: 210px;
  }
  .switcher .label b { font-size: 13px; }
  .switcher .label span { font-size: 11px; color: var(--chrome-muted); }
  .switcher .dots { display: flex; gap: 5px; align-items: center; padding: 0 8px; }
  .switcher .dot { width: 7px; height: 7px; border-radius: 50%; background: #3f4048; }
  .switcher .dot.on { background: #f4f4f5; }

  @media (max-width: 640px) {
    .switcher .label { min-width: 150px; }
  }

  /* ================================================================
     SHARED per-variant image tile — gradient ground + big emoji.
     Each variant restyles .tile via its own scope.
     ================================================================ */
  .tile {
    position: relative; display: grid; place-items: center; overflow: hidden;
    aspect-ratio: 1 / 1;
  }
  .tile .emoji { font-size: clamp(40px, 9vw, 84px); line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.15)); }
  .tile.wide { aspect-ratio: 4 / 3; }
  .tile.tall { aspect-ratio: 3 / 4; }

  img, svg { max-width: 100%; }

  /* prevent horizontal body scroll from any wide row */
  .scroll-x { overflow-x: auto; }

  /* =====================================================================================
     VARIANT A — "MERCADO"  (utilitarian, search-first, dense, Amazon-style)
     ===================================================================================== */
  .v-mercado {
    --ink: #17181c; --sub: #5b5e66; --line: #e4e5e8; --bg: #ffffff; --panel: #f6f7f8;
    --accent: #d6006e; --accent-ink: #ffffff; --star: #f5a623;
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .v-mercado .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .v-mercado header.site {
    position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line);
  }
  .v-mercado .bar { display: flex; align-items: center; gap: 20px; height: 66px; }
  .v-mercado .logo { font-weight: 800; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
  .v-mercado .logo span { color: var(--accent); }
  .v-mercado .searchbar { flex: 1; display: flex; }
  .v-mercado .searchbar input {
    flex: 1; height: 42px; border: 1.5px solid var(--ink); border-right: 0;
    border-radius: 8px 0 0 8px; padding: 0 14px; font-size: 15px; min-width: 0;
  }
  .v-mercado .searchbar button {
    height: 42px; padding: 0 20px; border: 0; background: var(--accent); color: #fff;
    font-weight: 700; border-radius: 0 8px 8px 0; cursor: pointer; font-size: 15px;
  }
  .v-mercado .navlink { color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; }
  .v-mercado .cart { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .v-mercado .cart .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 8px; }

  .v-mercado .hero {
    background: linear-gradient(180deg, #fff, var(--panel));
    border-bottom: 1px solid var(--line); text-align: center; padding: 40px 24px 44px;
  }
  .v-mercado .hero h1 { font-size: clamp(24px, 4vw, 36px); margin: 0 0 6px; letter-spacing: -.02em; }
  .v-mercado .hero p { color: var(--sub); margin: 0 0 22px; font-size: 16px; }
  .v-mercado .hero .bigsearch { max-width: 620px; margin: 0 auto; display: flex; }
  .v-mercado .hero .bigsearch input { flex: 1; height: 52px; border: 1.5px solid var(--ink); border-right: 0; border-radius: 10px 0 0 10px; padding: 0 18px; font-size: 16px; min-width: 0; }
  .v-mercado .hero .bigsearch button { height: 52px; padding: 0 26px; border: 0; background: var(--accent); color: #fff; font-weight: 700; border-radius: 0 10px 10px 0; cursor: pointer; }
  .v-mercado .chips-quick { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .v-mercado .chips-quick a { font-size: 13px; color: var(--ink); border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; text-decoration: none; }

  .v-mercado section.block { padding: 34px 0; }
  .v-mercado .block h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  .v-mercado .block .sub { color: var(--sub); font-size: 14px; margin: 0 0 18px; }

  .v-mercado .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  @media (max-width: 980px) { .v-mercado .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 620px) { .v-mercado .grid { grid-template-columns: repeat(2, 1fr); } }

  .v-mercado .card { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, border-color .15s; }
  .v-mercado .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.08); border-color: #cfd0d4; }
  .v-mercado .card .tile { border-bottom: 1px solid var(--line); }
  .v-mercado .card .badge-row { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; }
  .v-mercado .card .flag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: #fff; }
  .v-mercado .card .flag.new { background: #0a7d3b; }
  .v-mercado .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .v-mercado .card .name { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .v-mercado .card .cat { font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; }
  .v-mercado .card .stars { color: var(--star); font-size: 12px; }
  .v-mercado .card .price { font-size: 18px; font-weight: 800; margin-top: auto; }
  .v-mercado .card .add { margin-top: 4px; height: 36px; border: 1.5px solid var(--accent); color: var(--accent); background: #fff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .v-mercado .card .add:hover { background: var(--accent); color: #fff; }

  .v-mercado .catrow { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  @media (max-width: 980px) { .v-mercado .catrow { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 620px) { .v-mercado .catrow { grid-template-columns: repeat(3, 1fr); } }
  .v-mercado .catchip { text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 14px 6px; text-decoration: none; color: var(--ink); background: #fff; }
  .v-mercado .catchip .e { font-size: 26px; }
  .v-mercado .catchip .n { font-size: 12px; font-weight: 600; margin-top: 6px; display: block; }

  /* PDP */
  .v-mercado .pdp { display: grid; grid-template-columns: 90px 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .v-mercado .pdp { grid-template-columns: 1fr; } }
  .v-mercado .pdp .thumbs { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 900px) { .v-mercado .pdp .thumbs { flex-direction: row; } }
  .v-mercado .pdp .thumb { width: 90px; aspect-ratio: 1; border: 1.5px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-size: 26px; cursor: pointer; }
  .v-mercado .pdp .thumb.sel { border-color: var(--accent); }
  .v-mercado .pdp .maintile { border: 1px solid var(--line); border-radius: 12px; }
  .v-mercado .pdp .buybox { border: 1px solid var(--line); border-radius: 12px; padding: 18px; position: sticky; top: 82px; display: flex; flex-direction: column; gap: 12px; }
  .v-mercado .pdp .buybox h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .v-mercado .pdp .buybox .price { font-size: 30px; font-weight: 800; }
  .v-mercado .pdp .buybox .stk { color: #0a7d3b; font-size: 13px; font-weight: 600; }
  .v-mercado .pdp .buybox .cta { height: 48px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; }
  .v-mercado .pdp .buybox .cta.alt { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); }
  .v-mercado .pdp .spec { border-top: 1px solid var(--line); padding-top: 12px; font-size: 13px; color: var(--sub); display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  .v-mercado .pdp .spec b { color: var(--ink); font-weight: 600; }

  /* SEARCH */
  .v-mercado .search { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .v-mercado .search { grid-template-columns: 1fr; } }
  .v-mercado .facets { border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 16px; position: sticky; top: 82px; }
  .v-mercado .facets .fg { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .v-mercado .facets .fg:last-child { border-bottom: 0; }
  .v-mercado .facets h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; }
  .v-mercado .facets label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; color: var(--ink); cursor: pointer; }
  .v-mercado .facets label .cnt { margin-left: auto; color: var(--sub); font-size: 12px; }
  .v-mercado .facets label.disabled { color: #b9bbc0; cursor: default; }
  .v-mercado .facets .clear-row { color: var(--accent); font-size: 12px; font-weight: 600; }
  .v-mercado .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
  .v-mercado .results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .v-mercado .results-head .n { font-size: 14px; color: var(--sub); }
  .v-mercado .sel { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font-size: 13px; background: #fff; }
  .v-mercado .active-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .v-mercado .active-chips .c { font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; }
  .v-mercado .active-chips .c b { color: var(--sub); font-weight: 500; }
  .v-mercado .active-chips .x { cursor: pointer; color: var(--sub); }
  .v-mercado .active-chips .clearall { color: var(--accent); font-weight: 700; }
  .v-mercado .pager { display: flex; gap: 6px; justify-content: center; margin-top: 24px; }
  .v-mercado .pager a { min-width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
  .v-mercado .pager a.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .v-mercado footer.site { border-top: 1px solid var(--line); margin-top: 20px; padding: 28px 0; color: var(--sub); font-size: 13px; }

  /* =====================================================================================
     VARIANT B — "JARDÍN"  (editorial boutique, image-forward, calm, emerald + plum)
     ===================================================================================== */
  .v-jardin {
    --ink: #21201d; --sub: #6d6a63; --line: #e7e2d8; --bg: #faf8f3; --panel: #f2eee5;
    --green: #1f4d3a; --plum: #5f2a52; --accent: #1f4d3a; --gold: #b08542;
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .v-jardin .serif { font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif; }
  .v-jardin .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
  .v-jardin header.site { position: sticky; top: 0; z-index: 20; background: rgba(250,248,243,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .v-jardin .bar { display: flex; align-items: center; gap: 22px; height: 74px; }
  .v-jardin .logo { font-family: ui-serif, Georgia, serif; font-size: 26px; letter-spacing: .04em; font-weight: 500; }
  .v-jardin .logo small { display: block; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; letter-spacing: .34em; text-transform: uppercase; color: var(--sub); margin-top: -2px; }
  .v-jardin .searchbar { flex: 1; max-width: 420px; margin: 0 auto; display: flex; align-items: center; gap: 8px; border: 1px solid #d8d2c6; border-radius: 999px; padding: 0 16px; height: 42px; background: #fff; }
  .v-jardin .searchbar input { border: 0; outline: 0; flex: 1; font-size: 14px; background: transparent; min-width: 0; }
  .v-jardin .searchbar .i { color: var(--sub); }
  .v-jardin .navlink { text-decoration: none; color: var(--ink); font-size: 14px; letter-spacing: .02em; }
  .v-jardin .cart { display: flex; gap: 7px; align-items: center; font-size: 14px; }
  .v-jardin .cart .badge { background: var(--green); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }

  .v-jardin .hero { display: grid; grid-template-columns: 1fr 1.1fr; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 860px) { .v-jardin .hero { grid-template-columns: 1fr; } }
  .v-jardin .hero .txt { padding: 74px 56px; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 860px) { .v-jardin .hero .txt { padding: 44px 28px; } }
  .v-jardin .hero .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--plum); margin-bottom: 18px; }
  .v-jardin .hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.02; margin: 0 0 20px; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
  .v-jardin .hero p { color: var(--sub); font-size: 17px; line-height: 1.6; margin: 0 0 30px; max-width: 40ch; }
  .v-jardin .hero .btn { align-self: flex-start; text-decoration: none; background: var(--green); color: #fff; padding: 15px 30px; border-radius: 2px; font-size: 14px; letter-spacing: .04em; }
  .v-jardin .hero .art { position: relative; min-height: 420px; background: radial-gradient(120% 120% at 70% 20%, #fbe3ec, #e9d8e6 45%, #cddfd2 100%); display: grid; place-items: center; }
  .v-jardin .hero .art .emoji { font-size: clamp(90px, 16vw, 180px); filter: drop-shadow(0 12px 24px rgba(95,42,82,.25)); }
  .v-jardin .hero .art .cap { position: absolute; bottom: 22px; left: 22px; background: rgba(255,255,255,.85); padding: 8px 14px; font-size: 12px; }
  .v-jardin .hero .art .cap b { font-family: ui-serif, Georgia, serif; font-weight: 600; }

  .v-jardin section.block { padding: 68px 0; }
  .v-jardin .block .head { text-align: center; margin-bottom: 40px; }
  .v-jardin .block .head .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--plum); }
  .v-jardin .block .head h2 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 500; margin: 10px 0 0; letter-spacing: -.01em; }

  .v-jardin .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px 24px; }
  @media (max-width: 900px) { .v-jardin .grid { grid-template-columns: repeat(2, 1fr); } }
  .v-jardin .card { text-decoration: none; color: var(--ink); display: flex; flex-direction: column; }
  .v-jardin .card .tile { background: var(--panel); }
  .v-jardin .card:hover .tile .emoji { transform: scale(1.05); }
  .v-jardin .card .tile .emoji { transition: transform .4s ease; }
  .v-jardin .card .meta { padding: 16px 2px 0; text-align: center; }
  .v-jardin .card .cat { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--sub); }
  .v-jardin .card .name { font-family: ui-serif, Georgia, serif; font-size: 19px; margin: 6px 0; font-weight: 500; }
  .v-jardin .card .price { font-size: 15px; color: var(--green); letter-spacing: .02em; }

  .v-jardin .cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: var(--line); border: 1px solid var(--line); }
  @media (max-width: 780px) { .v-jardin .cats { grid-template-columns: repeat(2, 1fr); } }
  .v-jardin .catcell { background: var(--bg); text-decoration: none; color: var(--ink); padding: 30px 16px; text-align: center; transition: background .2s; }
  .v-jardin .catcell:hover { background: var(--panel); }
  .v-jardin .catcell .e { font-size: 30px; }
  .v-jardin .catcell .n { font-family: ui-serif, Georgia, serif; font-size: 15px; margin-top: 10px; }

  .v-jardin .occasion { background: var(--green); color: #fff; }
  .v-jardin .occasion .head h2 { color: #fff; }
  .v-jardin .occasion .head .eyebrow { color: #b9d3c4; }
  .v-jardin .occ-strip { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .v-jardin .occ-strip a { text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 10px 22px; font-size: 14px; }

  /* PDP */
  .v-jardin .pdp { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: start; }
  @media (max-width: 860px) { .v-jardin .pdp { grid-template-columns: 1fr; gap: 30px; } }
  .v-jardin .pdp .gallery .maintile { background: radial-gradient(120% 120% at 60% 25%, #fbe3ec, #cddfd2 100%); border-radius: 3px; }
  .v-jardin .pdp .gallery .row { display: flex; gap: 10px; margin-top: 10px; }
  .v-jardin .pdp .gallery .row .t { flex: 1; aspect-ratio: 1; background: var(--panel); display: grid; place-items: center; font-size: 26px; }
  .v-jardin .pdp .info .eyebrow { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--plum); }
  .v-jardin .pdp .info h1 { font-family: ui-serif, Georgia, serif; font-size: 40px; font-weight: 500; margin: 12px 0; line-height: 1.05; }
  .v-jardin .pdp .info .price { font-size: 24px; color: var(--green); margin-bottom: 22px; }
  .v-jardin .pdp .info p { color: var(--sub); line-height: 1.7; margin: 0 0 28px; }
  .v-jardin .pdp .info .cta { display: block; width: 100%; text-align: center; background: var(--green); color: #fff; border: 0; padding: 17px; border-radius: 2px; font-size: 15px; letter-spacing: .04em; cursor: pointer; margin-bottom: 12px; }
  .v-jardin .pdp .info .cta.alt { background: transparent; color: var(--green); border: 1px solid var(--green); }
  .v-jardin .pdp .info .detail { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 20px; font-size: 14px; }
  .v-jardin .pdp .info .detail .r { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dotted var(--line); }
  .v-jardin .pdp .info .detail .r span:first-child { color: var(--sub); }

  /* SEARCH */
  .v-jardin .search { display: grid; grid-template-columns: 230px 1fr; gap: 44px; align-items: start; }
  @media (max-width: 820px) { .v-jardin .search { grid-template-columns: 1fr; } }
  .v-jardin .facets .fg { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .v-jardin .facets .fg:first-child { padding-top: 0; }

/* annotation label helper */
function anno(txt){ return `<div class="anno"><span class="anno-pill">▸ Pantalla — ${txt}</span></div>`; }

/* ---------------------------------------------------------------- switcher ---- */
const VARIANTS = [
  {key:"A", fn:mercado, name:"A — Mercado", desc:"Utilitario · búsqueda-primero"},
  {key:"B", fn:jardin,  name:"B — Jardín",  desc:"Boutique editorial · imagen"},
  {key:"C", fn:fiesta,  name:"C — Fiesta",  desc:"Regalo · colorido y redondo"}
];

function currentKey(){
  const u = new URL(location.href);
  const k = (u.searchParams.get("variant") || "A").toUpperCase();
  return VARIANTS.some(v=>v.key===k) ? k : "A";
}

function render(){
  const key = currentKey();
  const v = VARIANTS.find(x=>x.key===key);
  document.getElementById("app").innerHTML = v.fn();
  document.getElementById("vname").textContent = v.name;
  document.getElementById("vdesc").textContent = v.desc;
  document.getElementById("dots").innerHTML = VARIANTS.map(x=>`<span class="dot ${x.key===key?'on':''}"></span>`).join("");
  window.scrollTo(0,0);
}

function go(dir){
  const keys = VARIANTS.map(v=>v.key);
  let i = keys.indexOf(currentKey());
  i = (i + dir + keys.length) % keys.length;
  const u = new URL(location.href);
  u.searchParams.set("variant", keys[i]);
  history.replaceState(null,"",u);
  render();
}

document.getElementById("prev").addEventListener("click", ()=>go(-1));
document.getElementById("next").addEventListener("click", ()=>go(1));
document.addEventListener("keydown", e=>{
  const t = e.target;
  if (t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  if (e.key==="ArrowLeft") go(-1);
  if (e.key==="ArrowRight") go(1);
});
render();
</script>
